appId: dev.the-manager.app
productName: The Manager
directories:
  output: release
files:
  - dist/**/*
  - assets/**/*
  - package.json
extraResources:
  # In Phase 2 we'll add the prebuilt apps/web here so startEmbeddedServer can find it.
  # - from: "../web/.next"
  #   to: "web/.next"
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
linux:
  target: ["AppImage"]
  icon: assets/icon.png
win:
  target: ["nsis"]
  icon: assets/icon.png
