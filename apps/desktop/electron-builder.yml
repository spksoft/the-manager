appId: dev.the-manager.app
productName: The Manager
directories:
  output: release
files:
  - dist/**/*
  - assets/**/*
  - package.json
extraResources:
  # Next.js standalone server. Split into two entries because electron-builder's
  # default file filter strips top-level `node_modules` from extraResources;
  # naming the subdir explicitly bypasses that filter. Layout in the bundle:
  #   Contents/Resources/web/apps/web/server.js   (entry point)
  #   Contents/Resources/web/node_modules/.pnpm/  (hoisted deps via symlinks)
  - from: "../web/.next/standalone/apps"
    to: "web/apps"
  - from: "../web/.next/standalone/node_modules"
    to: "web/node_modules"
    # pnpm hoists workspace-package convenience symlinks here. They aren't
    # required at runtime (workspace packages are inlined into Next chunks via
    # transpilePackages), and following them dereferences the *source* tree
    # into the bundle — which on a second build means copying release/ into
    # itself recursively until codesign chokes.
    filter:
      - "**/*"
      - "!**/.pnpm/node_modules/@the-manager/**"
  # Static chunks live outside the standalone tree; reunite them at runtime.
  - from: "../web/.next/static"
    to: "web/apps/web/.next/static"
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  # macOS won't show the microphone TCC prompt unless this string is in the
  # bundle's Info.plist. Without it the renderer's getUserMedia / Web Speech
  # API calls fail silently in packaged builds.
  extendInfo:
    NSMicrophoneUsageDescription: The Manager uses your microphone for voice input to dictate prompts to agents.
  target:
    - target: dmg
      arch:
        - arm64
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
linux:
  target: ["AppImage"]
  icon: assets/icon.png
win:
  target: ["nsis"]
  icon: assets/icon.png
